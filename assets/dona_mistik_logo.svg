<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="favGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="favStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <radialGradient id="favCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="favDarkDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2619" />
      <stop offset="50%" stop-color="#24150D" />
      <stop offset="100%" stop-color="#140C07" />
    </linearGradient>
  </defs>

  <!-- Base Dark Celestial Disc -->
  <circle cx="60" cy="60" r="56" fill="url(#favDarkDisc)" stroke="url(#favGoldRing)" stroke-width="3" />

  <!-- Outer Astrological Ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.75" />
  
  <!-- 4 Cardinal Markers -->
  <circle cx="60" cy="9" r="2.5" fill="#FDE68A" />
  <circle cx="60" cy="111" r="2.5" fill="#FDE68A" />
  <circle cx="9" cy="60" r="2.5" fill="#FDE68A" />
  <circle cx="111" cy="60" r="2.5" fill="#FDE68A" />

  <!-- Orbiting Cosmic Ring -->
  <ellipse cx="60" cy="60" rx="38" ry="18" fill="none" stroke="url(#favGoldRing)" stroke-width="1.5" opacity="0.7" transform="rotate(-25 60 60)" />

  <!-- Celestial Crescent Moon -->
  <path d="M 60 24 C 42 24 28 38 28 60 C 28 82 42 96 60 96 C 50 88 44 76 44 60 C 44 44 50 32 60 24 Z" fill="url(#favStarGrad)" opacity="0.9" />

  <!-- Core Radiant Glow -->
  <circle cx="60" cy="60" r="22" fill="url(#favCoreGlow)" />

  <!-- 8-Pointed Star -->
  <polygon points="60,18 64,54 98,60 64,66 60,102 56,66 22,60 56,54" fill="url(#favStarGrad)" />
  <polygon points="60,33 66,54 87,33 66,66 60,87 54,66 33,87 54,54" fill="#FDE68A" opacity="0.85" />

  <!-- Diamond Spark Core -->
  <circle cx="60" cy="60" r="5" fill="#FFFFFF" />
  <circle cx="60" cy="60" r="2.5" fill="#FEF08A" />
</svg>
